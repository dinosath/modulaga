services:
  modulaga-db:
    image: postgres:18.2
    environment:
      POSTGRES_DB: modulaga
      POSTGRES_USER: modulaga
      POSTGRES_PASSWORD: modulaga
    ports:
      - "5432:5432"
    volumes:
      - modulaga_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulaga -d modulaga"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [registry]

  ferriskey-db:
    image: postgres:18.2
    environment:
      POSTGRES_DB: ferriskey
      POSTGRES_USER: ferriskey
      POSTGRES_PASSWORD: ferriskey
    ports:
      - "5433:5432"
    volumes:
      - ferriskey_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferriskey -d ferriskey"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [local, registry]

  ferriskey-migrate:
    image: ${FERRISKEY_API_IMAGE:-ghcr.io/ferriskey/ferriskey-api:${FERRISKEY_TAG:-latest}}
    entrypoint: ["sqlx"]
    command: ["migrate", "run", "--source", "/usr/local/src/ferriskey/migrations"]
    environment:
      DATABASE_URL: postgresql://ferriskey:ferriskey@ferriskey-db/ferriskey
    depends_on:
      ferriskey-db:
        condition: service_healthy
    restart: "no"
    profiles: [local, registry]

  ferriskey-api:
    image: ${FERRISKEY_API_IMAGE:-ghcr.io/ferriskey/ferriskey-api:${FERRISKEY_TAG:-latest}}
    environment:
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310,http://localhost:5556,http://localhost:4176,http://127.0.0.1:4176,http://localhost:4177,http://127.0.0.1:4177
      SERVER_PUBLIC_URL: http://localhost:3333
      WEBAPP_URL: http://localhost:5556
      DATABASE_HOST: ferriskey-db
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: ferriskey
      DATABASE_USER: ferriskey
      ADMIN_USERNAME: ${FERRISKEY_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${FERRISKEY_ADMIN_EMAIL:-admin@localhost}
    ports:
      - "3333:3333"
    depends_on:
      ferriskey-migrate:
        condition: service_completed_successfully
    profiles: [local, registry]

  ferriskey-console:
    image: ${FERRISKEY_WEBAPP_IMAGE:-ghcr.io/ferriskey/ferriskey-webapp:${FERRISKEY_TAG:-latest}}
    environment:
      API_URL: http://localhost:3333
    ports:
      - "5556:80"
    depends_on:
      - ferriskey-api
    profiles: [local, registry]

  workspace-config-local:
    image: modulaga/workspace-config:local
    build:
      context: .
      dockerfile: services/workspace-config/Dockerfile
    environment:
      WORKSPACE_STORE: sqlite
      DATABASE_URL: sqlite:///app/data/workspace-config.sqlite?mode=rwc
      DEFAULT_WORKSPACE_CONFIG_PATH: /app/workspace-config/workspaces/default.json
      AUTH_MODE: disabled
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310,http://localhost:4176,http://127.0.0.1:4176
      RUST_LOG: info
    ports:
      - "4303:4303"
    volumes:
      - ./workspace-config:/app/workspace-config:ro
      - modulaga_config_data:/app/data
    profiles: [local]

  workspace-config:
    image: ${MODULAGA_CONFIG_IMAGE:-ghcr.io/modulaga/workspace-config:${MODULAGA_TAG:-latest}}
    environment:
      DATABASE_URL: postgres://modulaga:modulaga@modulaga-db:5432/modulaga
      DEFAULT_WORKSPACE_CONFIG_PATH: /app/workspace-config/workspaces/default.json
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      OIDC_DISCOVERY_URL: http://ferriskey-api:3333/realms/modulaga/.well-known/openid-configuration
      OIDC_JWKS_URI: http://ferriskey-api:3333/realms/modulaga/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-modulaga-admin}
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310,http://localhost:4176,http://127.0.0.1:4176
      RUST_LOG: info
    ports:
      - "4303:4303"
    volumes:
      - ./workspace-config:/app/workspace-config:ro
    depends_on:
      modulaga-db:
        condition: service_healthy
      ferriskey-api:
        condition: service_started
    profiles: [registry]

  app-catalog-local:
    image: modulaga/app-catalog:local
    build:
      context: .
      dockerfile: services/workspace-config/Dockerfile
    command: ["/usr/local/bin/app-catalog"]
    environment:
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310
      CATALOG_BIND_ADDRESS: 0.0.0.0:4304
      CATALOG_PATH: /app/fixtures/catalog.local.json
      RUST_LOG: info
    ports:
      - "4304:4304"
    volumes:
      - ./workspace-config:/app/workspace-config:ro
      - ./fixtures:/app/fixtures:ro
    profiles: [local]

  app-catalog:
    image: ${MODULAGA_CATALOG_IMAGE:-ghcr.io/modulaga/app-catalog:${MODULAGA_TAG:-latest}}
    environment:
      CATALOG_PATH: /app/fixtures/catalog.compose.json
      CATALOG_BIND_ADDRESS: 0.0.0.0:4304
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310
    volumes:
      - ./fixtures:/app/fixtures:ro
    ports:
      - "4304:4304"
    profiles: [registry]

  content-types-local:
    image: modulaga/content-types:local
    build:
      context: .
      dockerfile: services/content-types/Dockerfile
    environment:
      CONTENT_TYPES_DATABASE_URL: sqlite:///app/data/content-types.sqlite?mode=rwc
      AUTH_MODE: disabled
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310
      RUST_LOG: info
    ports:
      - "4305:4305"
    volumes:
      - modulaga_content_types_data:/app/data
    profiles: [local]

  content-types:
    image: ${MODULAGA_CONTENT_TYPES_IMAGE:-ghcr.io/modulaga/content-types:${MODULAGA_TAG:-latest}}
    environment:
      CONTENT_TYPES_DATABASE_URL: sqlite:///app/data/content-types.sqlite?mode=rwc
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      OIDC_DISCOVERY_URL: http://ferriskey-api:3333/realms/modulaga/.well-known/openid-configuration
      OIDC_JWKS_URI: http://ferriskey-api:3333/realms/modulaga/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-modulaga-admin}
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310
      RUST_LOG: info
    ports:
      - "4305:4305"
    volumes:
      - modulaga_content_types_data:/app/data
    depends_on:
      ferriskey-api:
        condition: service_started
    profiles: [registry]

  application-generator-local:
    image: modulaga/application-generator:local
    build:
      context: .
      dockerfile: services/application-generator/Dockerfile
    environment:
      APPLICATION_GENERATOR_DATABASE_URL: sqlite:///app/data/application-generator.sqlite?mode=rwc
      CONTENT_TYPES_API_URL: http://content-types-local:4305
      GENERATED_APPS_DIR: /app/generated
      APPLICATION_GENERATOR_BIND_ADDRESS: 0.0.0.0:4306
      AUTH_MODE: disabled
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310,http://localhost:4300,http://127.0.0.1:4300,http://localhost:4177,http://127.0.0.1:4177
      RUST_LOG: info
    ports:
      - "4306:4306"
    volumes:
      - modulaga_application_generator_data:/app/data
      - ./.data/generated-apps:/app/generated
    depends_on:
      - content-types-local
    profiles: [local]

  application-generator:
    image: ${MODULAGA_APPLICATION_GENERATOR_IMAGE:-ghcr.io/modulaga/application-generator:${MODULAGA_TAG:-latest}}
    build:
      context: .
      dockerfile: services/application-generator/Dockerfile
    environment:
      APPLICATION_GENERATOR_DATABASE_URL: sqlite:///app/data/application-generator.sqlite?mode=rwc
      CONTENT_TYPES_API_URL: http://content-types:4305
      GENERATED_APPS_DIR: /app/generated
      APPLICATION_GENERATOR_BIND_ADDRESS: 0.0.0.0:4306
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      OIDC_DISCOVERY_URL: http://ferriskey-api:3333/realms/modulaga/.well-known/openid-configuration
      OIDC_JWKS_URI: http://ferriskey-api:3333/realms/modulaga/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-modulaga-admin}
      ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310,http://localhost:4177,http://127.0.0.1:4177
      RUST_LOG: info
    ports:
      - "4306:4306"
    volumes:
      - modulaga_application_generator_data:/app/data
      - modulaga_generated_apps:/app/generated
    depends_on:
      - content-types
      - ferriskey-api
    profiles: [registry]

  application-generator-app-local:
    image: modulaga/application-generator-app:local
    build:
      context: .
      dockerfile: apps/application-generator/Dockerfile
      args:
        APPLICATION_GENERATOR_PUBLIC_URL: http://localhost:4177/
    environment:
      MODULAGA_APPLICATION_GENERATOR_API_URL: http://localhost:4306
      MODULAGA_FERRISKEY_ISSUER: ""
      MODULAGA_FERRISKEY_CLIENT_ID: ""
    ports:
      - "4177:80"
    depends_on:
      - application-generator-local
    profiles: [local]

  application-generator-app:
    image: ${MODULAGA_APPLICATION_GENERATOR_APP_IMAGE:-ghcr.io/modulaga/application-generator-app:${MODULAGA_TAG:-latest}}
    environment:
      MODULAGA_APPLICATION_GENERATOR_API_URL: ${MODULAGA_APPLICATION_GENERATOR_API_URL:-http://localhost:4306}
      MODULAGA_FERRISKEY_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      MODULAGA_FERRISKEY_CLIENT_ID: ${FERRISKEY_CLIENT_ID:-modulaga-shell}
    ports:
      - "4177:80"
    depends_on:
      - application-generator
    profiles: [registry]

  content-types-app-local:
    image: modulaga/content-types-app:local
    build:
      context: .
      dockerfile: apps/content-types/Dockerfile
      args:
        CONTENT_TYPES_PUBLIC_URL: http://localhost:4175/
    ports:
      - "4175:80"
    profiles: [local]

  content-types-app:
    image: ${MODULAGA_CONTENT_TYPES_APP_IMAGE:-ghcr.io/modulaga/content-types-app:${MODULAGA_TAG:-latest}}
    build:
      context: .
      dockerfile: apps/content-types/Dockerfile
      args:
        CONTENT_TYPES_PUBLIC_URL: http://localhost:4175/
    ports:
      - "4175:80"
    profiles: [registry]

  admin-panel-app-local:
    image: modulaga/admin-panel-app:local
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
      args:
        ADMIN_PANEL_PUBLIC_URL: http://localhost:4176/
    environment:
      MODULAGA_CONFIG_API_URL: http://localhost:4303
      MODULAGA_WORKSPACE_ID: default
      MODULAGA_FERRISKEY_ISSUER: ""
      MODULAGA_FERRISKEY_CLIENT_ID: ""
    ports:
      - "4176:80"
    depends_on:
      - workspace-config-local
    profiles: [local]

  admin-panel-app:
    image: ${MODULAGA_ADMIN_PANEL_APP_IMAGE:-ghcr.io/modulaga/admin-panel-app:${MODULAGA_TAG:-latest}}
    environment:
      MODULAGA_CONFIG_API_URL: ${MODULAGA_CONFIG_API_URL:-http://localhost:4303}
      MODULAGA_WORKSPACE_ID: ${MODULAGA_WORKSPACE_ID:-default}
      MODULAGA_FERRISKEY_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      MODULAGA_FERRISKEY_CLIENT_ID: ${FERRISKEY_CLIENT_ID:-modulaga-shell}
    ports:
      - "4176:80"
    depends_on:
      - workspace-config
    profiles: [registry]

  shell-local:
    image: modulaga/shell:local
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    environment:
      MODULAGA_CONFIG_API_URL: http://localhost:4303
      MODULAGA_CATALOG_API_URL: http://localhost:4304
      MODULAGA_CONTENT_TYPES_API_URL: http://localhost:4305
      MODULAGA_APPLICATION_GENERATOR_API_URL: http://localhost:4306
      MODULAGA_WORKSPACE_ID: default
      MODULAGA_FERRISKEY_ISSUER: ""
      MODULAGA_FERRISKEY_CLIENT_ID: ""
    ports:
      - "4310:80"
    depends_on:
      - workspace-config-local
      - app-catalog-local
      - content-types-local
      - content-types-app-local
      - admin-panel-app-local
      - application-generator-local
      - application-generator-app-local
    profiles: [local]

  shell:
    image: ${MODULAGA_SHELL_IMAGE:-ghcr.io/modulaga/shell:${MODULAGA_TAG:-latest}}
    environment:
      MODULAGA_CONFIG_API_URL: ${MODULAGA_CONFIG_API_URL:-http://localhost:4303}
      MODULAGA_CATALOG_API_URL: ${MODULAGA_CATALOG_API_URL:-http://localhost:4304}
      MODULAGA_CONTENT_TYPES_API_URL: ${MODULAGA_CONTENT_TYPES_API_URL:-http://localhost:4305}
      MODULAGA_APPLICATION_GENERATOR_API_URL: ${MODULAGA_APPLICATION_GENERATOR_API_URL:-http://localhost:4306}
      MODULAGA_WORKSPACE_ID: ${MODULAGA_WORKSPACE_ID:-default}
      MODULAGA_FERRISKEY_ISSUER: ${OIDC_ISSUER:-http://localhost:3333/realms/modulaga}
      MODULAGA_FERRISKEY_CLIENT_ID: ${FERRISKEY_CLIENT_ID:-modulaga-shell}
    ports:
      - "4310:80"
    depends_on:
      - workspace-config
      - app-catalog
      - content-types
      - content-types-app
      - admin-panel-app
      - application-generator
      - application-generator-app
    profiles: [registry]

  demo-react-local:
    image: modulaga/demo-react:local
    build:
      context: .
      dockerfile: apps/demo-react/Dockerfile
    ports:
      - "4174:80"
    profiles: [local]

  demo-react:
    image: ${MODULAGA_DEMO_REACT_IMAGE:-ghcr.io/modulaga/demo-react:${MODULAGA_TAG:-latest}}
    ports:
      - "4174:80"
    profiles: [registry]

volumes:
  modulaga_data:
  modulaga_config_data:
  modulaga_content_types_data:
  modulaga_application_generator_data:
  modulaga_generated_apps:
  ferriskey_data:
