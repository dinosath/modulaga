[package]
name = "application-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
buffa = "0.9"
connectrpc = { version = "0.9", features = ["axum"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "fs", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
workspace-config = { path = "../workspace-config" }

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
