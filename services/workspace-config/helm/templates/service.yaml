apiVersion: v1
kind: Service
metadata:
  name: modulaga-config-api-service
  labels:
    app: modulaga-config-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: modulaga-config-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP